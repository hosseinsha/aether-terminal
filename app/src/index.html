<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AETHER</title>
  <link rel="stylesheet" href="vendor/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-bg="aurora">
  <div id="app">
    <div id="titlebar" data-tauri-drag-region>
      <span class="brand"><span class="dot"></span> AETHER</span>
      <span id="title" class="title">local</span>
    </div>

    <div id="stage">
      <div id="canvas"></div>
    </div>

    <div id="dock">
      <div class="dock-btn" data-act="split"><span>⊞ Split</span><span class="kbd">⌘D</span></div>
      <div class="dock-btn" data-act="close"><span>✕ Close</span><span class="kbd">⌘W</span></div>
      <div class="dock-sep"></div>
      <div class="dock-btn" data-act="max"><span>⤢ Zoom</span><span class="kbd">⌘↵</span></div>
      <div class="dock-btn" data-act="overview"><span>▦ Overview</span><span class="kbd">⌘O</span></div>
      <div class="dock-sep"></div>
      <div class="dock-btn" id="theme-btn" data-act="theme"><span class="swatch"></span><span id="theme-label">Default</span><span class="kbd">⌘Y</span></div>
    </div>
  </div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
