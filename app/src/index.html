<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AETHER</title>
  <link rel="stylesheet" href="vendor/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-bg="aurora">
  <canvas id="pixelart"></canvas>
  <div id="app">
    <div id="titlebar" data-tauri-drag-region>
      <span class="brand"><span class="dot"></span> AETHER</span>
      <div id="host-wrap">
        <button id="host-btn"><span class="hdot"></span><span id="host-label">local</span><span class="caret">▾</span></button>
        <div id="host-menu"></div>
      </div>
      <div id="session-wrap">
        <button id="session-btn" title="Sessions  ⌘L"><span class="sdot"></span><span id="session-label">0 sessions</span><span class="caret">▾</span></button>
        <div id="session-menu"></div>
      </div>
      <div id="controls">
        <button class="ctl" data-act="split" title="Split  ⌘D">⊞ <span class="lbl">Split</span></button>
        <button class="ctl" data-act="close" title="Close  ⌘W">✕ <span class="lbl">Close</span></button>
        <button class="ctl" data-act="max" title="Zoom  ⌘↵">⤢ <span class="lbl">Zoom</span></button>
        <button class="ctl" data-act="overview" title="Overview  ⌘O">▦ <span class="lbl">Overview</span></button>
        <button class="ctl" data-act="theme" title="Cycle theme  ⌘Y"><span class="swatch"></span><span id="theme-label" class="lbl">Default</span></button>
        <button class="ctl" data-act="appearance" title="Appearance  ⌘,">✦ <span class="lbl">Style</span></button>
        <button class="ctl" data-act="shortcuts" title="Keyboard shortcuts  ⌘/">⌨ <span class="lbl">Keys</span></button>
      </div>
      <button id="ctl-toggle" title="Show/hide controls  ⌘.">⋯</button>
    </div>

    <div id="stage">
      <div id="canvas"></div>
    </div>

    <div id="appearance">
      <div class="ap-head">
        <h2>✦ APPEARANCE</h2>
        <button id="ap-close" title="Close  Esc">✕</button>
      </div>
      <div class="sub" style="margin-top:4px">Live design tokens — tweak the look in real time.</div>

      <div class="grp"><label>Background scene</label>
        <div class="scene-row" id="ap-scenes">
          <button type="button" data-scene="aurora">Aurora</button>
          <button type="button" data-scene="retro">Synthwave</button>
          <button type="button" data-scene="forest">Forest</button>
          <button type="button" data-scene="mono">Mono</button>
          <button type="button" data-scene="ocean">Ocean</button>
          <button type="button" data-scene="ferrari">Ferrari</button>
          <button type="button" data-scene="claude">Claude</button>
          <button type="button" data-scene="mario">Mario</button>
        </div>
      </div>
      <div class="grp">
        <label>Theme</label>
        <div class="theme-list" id="ap-themes"></div>
        <div class="theme-actions">
          <button type="button" id="th-save">＋ Save as…</button>
          <button type="button" id="th-export">⤓ Export</button>
          <button type="button" id="th-import">⤒ Import</button>
        </div>
        <div class="theme-io" id="th-io" hidden>
          <input type="text" id="th-name" placeholder="Theme name…" spellcheck="false">
          <textarea id="th-json" placeholder="Paste theme JSON…" spellcheck="false"></textarea>
          <div class="theme-io-btns">
            <button type="button" id="th-ok">OK</button>
            <button type="button" id="th-close">Close</button>
          </div>
        </div>
      </div>
      <div class="grp"><label>Accent</label><div class="swatches" id="ap-accents"></div></div>

      <div class="grp"><label>Gap <span class="val" id="v-gap">8px</span></label><input type="range" id="r-gap" min="0" max="40" value="8"></div>
      <div class="grp"><label>Corner radius <span class="val" id="v-radius">14px</span></label><input type="range" id="r-radius" min="0" max="30" value="14"></div>
      <div class="grp"><label>Pane translucency <span class="val" id="v-alpha">0.55</span></label><input type="range" id="r-alpha" min="20" max="100" value="55"></div>

      <div class="sub">Depth of field — how far unfocused panes recede</div>
      <div class="grp"><label>Inactive dim <span class="val" id="v-dim">0.60</span></label><input type="range" id="r-dim" min="20" max="100" value="60"></div>
      <div class="grp"><label>Inactive blur <span class="val" id="v-blur">2px</span></label><input type="range" id="r-blur" min="0" max="10" step="0.5" value="2"></div>
      <div class="grp"><label>Inactive desaturate <span class="val" id="v-sat">0.60</span></label><input type="range" id="r-sat" min="0" max="100" value="60"></div>

      <div class="toggle-row">Film grain <div class="switch on" id="t-grain"></div></div>
      <div class="toggle-row">CRT scanlines <div class="switch" id="t-crt"></div></div>
    </div>
  </div>

  <div id="shortcuts" hidden>
    <div class="sc-card">
      <div class="sc-head"><h2>⌨ KEYBOARD SHORTCUTS</h2><button id="sc-close" title="Close  Esc">✕</button></div>
      <div class="sc-body" id="sc-body"></div>
      <div class="sc-hint">Mouse — drag a pane edge to resize · in Overview, drag panes to rearrange · click a pane to focus it</div>
    </div>
  </div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-webgl.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
