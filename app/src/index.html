<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AETHER</title>
  <link rel="stylesheet" href="vendor/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-bg="aurora">
  <div id="app">
    <div id="titlebar" data-tauri-drag-region>
      <span class="brand"><span class="dot"></span> AETHER</span>
      <span id="title" class="title">local</span>
      <div id="controls">
        <button class="ctl" data-act="split" title="Split  ⌘D">⊞ <span class="lbl">Split</span></button>
        <button class="ctl" data-act="close" title="Close  ⌘W">✕ <span class="lbl">Close</span></button>
        <button class="ctl" data-act="max" title="Zoom  ⌘↵">⤢ <span class="lbl">Zoom</span></button>
        <button class="ctl" data-act="overview" title="Overview  ⌘O">▦ <span class="lbl">Overview</span></button>
        <button class="ctl" id="theme-btn" data-act="theme" title="Cycle theme  ⌘Y"><span class="swatch"></span><span id="theme-label" class="lbl">Default</span></button>
      </div>
      <button id="ctl-toggle" title="Show/hide controls  ⌘.">⋯</button>
    </div>

    <div id="stage">
      <div id="canvas"></div>
    </div>
  </div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
