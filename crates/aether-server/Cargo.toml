[package]
name = "aether-server"
version = "0.1.0"
edition = "2021"
description = "Headless Aether session server: owns PTYs, grid state and scrollback so sessions persist across client (re)connections, locally or remotely."

[[bin]]
name = "aether-server"
path = "src/main.rs"

[[bin]]
name = "aether-smoke"
path = "src/bin/smoke.rs"

[dependencies]
aether-proto = { path = "../aether-proto" }
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
vt100 = "0.15"
anyhow = "1"
